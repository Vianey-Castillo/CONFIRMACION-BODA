<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Confirmación de asistencia</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, serif;
      background: #f8f1f3;
      color: #4a3a3f;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .tarjeta {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 40px 30px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .corazon {
      font-size: 38px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 29px;
      font-weight: normal;
      color: #6b4d57;
    }

    .subtitulo {
      color: #806f76;
      line-height: 1.6;
      margin: 15px 0 28px;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 8px;
      font-size: 15px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d8c7cd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #9c7d88;
    }

    .boton {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      margin-top: 15px;
      background: #8f6d79;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .boton:hover {
      opacity: 0.9;
    }

    .boton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #invitado {
      display: none;
      margin-top: 30px;
      border-top: 1px solid #eadfe3;
      padding-top: 25px;
    }

    .nombre {
      font-size: 23px;
      color: #6b4d57;
      margin-bottom: 8px;
    }

    .lugares {
      color: #806f76;
      margin-bottom: 20px;
    }

    .opciones {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .opcion {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid #cdbac2;
      background: white;
      color: #8f6d79;
      font-size: 17px;
      cursor: pointer;
    }

    .opcion.seleccionada {
      background: #8f6d79;
      color: white;
    }

    #mensaje {
      margin-top: 20px;
      line-height: 1.5;
    }

    .error {
      color: #a44f5b;
    }

    .exito {
      color: #557a61;
    }
  </style>
</head>

<body>

  <div class="tarjeta">

    <div class="corazon">🤍</div>

    <h1>Confirmación de asistencia</h1>

    <p class="subtitulo">
      Nos encantará compartir este día tan especial contigo.
      <br>
      Escribe tu nombre para comenzar.
    </p>

    <label for="nombre">
      Nombre completo
    </label>

    <input
      type="text"
      id="nombre"
      placeholder="Ej. Ana García"
    >

    <button
      class="boton"
      id="botonBuscar"
      onclick="buscarInvitado()"
    >
      Buscar invitación
    </button>

    <div id="invitado">

      <div
        class="nombre"
        id="nombreMostrado"
      ></div>

      <div
        class="lugares"
        id="lugaresMostrados"
      ></div>

      <p>
        ¿Cuántas personas asistirán?
      </p>

      <div
        class="opciones"
        id="opciones"
      ></div>

      <button
        class="boton"
        id="botonConfirmar"
        onclick="confirmar()"
        style="display:none;"
      >
        Confirmar asistencia
      </button>

      <div id="mensaje"></div>

    </div>

  </div>

  <script>

    /* =====================================
       GOOGLE SHEETS
       ===================================== */

    const URL_GOOGLE_SHEETS =
      "https://script.google.com/macros/s/AKfycbwkDlsj7mxeMwTr5LHBMp4YugtgFZeZJcZC2yXASmINfJW8y-YYyPJ-2RlOiUbmp_8gOw/exec";


    let invitadoActual = null;
    let cantidadSeleccionada = null;


    /* =====================================
       BUSCAR INVITADO
       ===================================== */

    function buscarInvitado() {

      const nombre =
        document
          .getElementById("nombre")
          .value
          .trim();


      if (!nombre) {

        mostrarMensaje(
          "Por favor escribe tu nombre.",
          true
        );

        return;
      }


      const botonBuscar =
        document.getElementById(
          "botonBuscar"
        );


      botonBuscar.disabled = true;

      botonBuscar.textContent =
        "Buscando...";


      document
        .getElementById("invitado")
        .style.display = "none";


      const url =
        URL_GOOGLE_SHEETS +
        "?nombre=" +
        encodeURIComponent(nombre);


      fetch(url)

        .then(function(respuesta) {
          return respuesta.json();
        })

        .then(function(datos) {

          botonBuscar.disabled = false;

          botonBuscar.textContent =
            "Buscar invitación";


          if (!datos.ok) {

            mostrarMensaje(
              "No encontramos una invitación con ese nombre.",
              true
            );

            return;
          }


          invitadoActual =
            datos.invitado;


          document
            .getElementById("nombreMostrado")
            .textContent =
            "¡Hola, " +
            invitadoActual.nombre +
            "!";


          document
            .getElementById("lugaresMostrados")
            .textContent =
            "Tienes " +
            invitadoActual.lugares +
            " " +
            (
              invitadoActual.lugares === 1
                ? "lugar"
                : "lugares"
            ) +
            " asignado" +
            (
              invitadoActual.lugares === 1
                ? ""
                : "s"
            ) +
            ".";


          document
            .getElementById("invitado")
            .style.display = "block";


          document
            .getElementById("mensaje")
            .textContent = "";


          crearOpciones(
            invitadoActual.lugares
          );

        })

        .catch(function() {

          botonBuscar.disabled = false;

          botonBuscar.textContent =
            "Buscar invitación";


          mostrarMensaje(
            "No pudimos consultar la invitación. Intenta nuevamente.",
            true
          );

        });

    }


    /* =====================================
       OPCIONES DE PERSONAS
       ===================================== */

    function crearOpciones(maximo) {

      const contenedor =
        document.getElementById(
          "opciones"
        );


      contenedor.innerHTML = "";

      cantidadSeleccionada = null;


      document
        .getElementById("botonConfirmar")
        .style.display = "none";


      for (
        let i = 1;
        i <= maximo;
        i++
      ) {

        const boton =
          document.createElement(
            "button"
          );


        boton.textContent = i;

        boton.className = "opcion";


        boton.onclick =
          function() {

            document
              .querySelectorAll(
                ".opcion"
              )
              .forEach(
                function(elemento) {

                  elemento.classList
                    .remove(
                      "seleccionada"
                    );

                }
              );


            boton.classList.add(
              "seleccionada"
            );


            cantidadSeleccionada = i;


            document
              .getElementById(
                "botonConfirmar"
              )
              .style.display = "block";

          };


        contenedor.appendChild(
          boton
        );

      }

    }


    /* =====================================
       CONFIRMAR
       ===================================== */

    function confirmar() {

      if (!cantidadSeleccionada) {

        mostrarMensaje(
          "Selecciona cuántas personas asistirán.",
          true
        );

        return;
      }


      if (!invitadoActual) {

        mostrarMensaje(
          "No encontramos tu invitación.",
          true
        );

        return;
      }


      const boton =
        document.getElementById(
          "botonConfirmar"
        );


      boton.disabled = true;

      boton.textContent =
        "Guardando...";


      mostrarMensaje(
        "Guardando tu confirmación...",
        false
      );


      const datos = {

        nombre:
          invitadoActual.nombre,

        confirmados:
          cantidadSeleccionada

      };


      fetch(
        URL_GOOGLE_SHEETS,
        {
          method: "POST",

          mode: "no-cors",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(datos)
        }
      )

      .then(function() {

        mostrarMensaje(

          "¡Gracias! Tu asistencia ha sido confirmada para " +
          cantidadSeleccionada +
          " " +
          (
            cantidadSeleccionada === 1
              ? "persona."
              : "personas."
          ),

          false

        );


        boton.style.display =
          "none";

      })

      .catch(function() {

        boton.disabled = false;

        boton.textContent =
          "Confirmar asistencia";


        mostrarMensaje(
          "No pudimos guardar la confirmación. Intenta nuevamente.",
          true
        );

      });

    }


    /* =====================================
       MENSAJES
       ===================================== */

    function mostrarMensaje(
      texto,
      error
    ) {

      const mensaje =
        document.getElementById(
          "mensaje"
        );


      mensaje.textContent =
        texto;


      mensaje.className =
        error
          ? "error"
          : "exito";

    }

  </script>

</body>
</html>
